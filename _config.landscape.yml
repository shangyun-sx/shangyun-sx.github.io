# landscape 主题配置
# 本文件会与 node_modules/hexo-theme-landscape/_config.yml 深度合并（覆盖同名键），
# 所以只写需要改动的项即可。切勿直接改 node_modules 里的主题文件 —— npm update 会覆盖掉。
# 完整可配置项见：node_modules/hexo-theme-landscape/_config.yml

# ===============
# Header
# ===============
# 导航菜单。注意：这里的路径必须有对应页面，否则是死链。
# 侧栏的分类/标签组件已经承担了浏览入口，所以不额外加 /categories、/tags 菜单项。
menu:
  Home: /
  Archives: /archives

# RSS 链接，指向 hexo-generator-feed 生成的 atom.xml
rss: /atom.xml

# 页头大图（相对于主题的 source 目录，也可以填完整外链）
banner: images/banner.jpg

# 页头副标题。留空则回退到 _config.yml 的 subtitle
subtitle:

# 右上角社交图标。键名必须是 Fork Awesome 的图标名（去掉 fa- 前缀）
# 图标全集：https://forkaweso.me/Fork-Awesome/icons/
links:
  github: https://github.com/shangyun-sx
  # twitter: https://twitter.com/your_account
  # telegram: https://t.me/your_account

# ===============
# Content
# ===============
# 摘要后的「阅读全文」链接文案
excerpt_link: Read More
# 图片灯箱
fancybox: true

# ===============
# Footer
# ===============
copyright: |-
  由 <a href="https://hexo.io/" target="_blank">Hexo</a> 驱动 · 托管于 <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>

# ===============
# Sidebar
# ===============
# 侧栏位置：left / right / bottom / false
sidebar: right
# 侧栏组件，按数组顺序从上到下渲染。
# 可选：category / tag / tagcloud / archive / recent_posts
#
# 注意：Hexo 合并主题配置时对数组取「并集」而不是覆盖（hexo-util 的 deepMerge
# 用的是 arrayMerge，只增不减），所以这里少写几个并不能关掉主题自带的组件。
# 主题默认启用全部 5 个，因此这里不再重复声明，维持默认即可。
# 确实想去掉某个组件的话，只能改主题源码或换主题。
# widgets:

# 归档粒度：monthly / yearly
archive_type: 'monthly'
# 组件里是否显示文章数量
show_count: true
# 侧栏「最新文章」显示条数
recent_posts_limits: 5

# ===============
# Miscellaneous
# ===============
favicon: /favicon.png

# 统计代码，填入 ID 即可启用
google_analytics:
gauges_analytics:

# ===============
# 评论系统
# ===============
# valine 需要 LeanCloud 账号，启用步骤：
#   1. 到 https://leancloud.cn 注册，创建一个应用（选「国际版」，无需备案）
#   2. 进入 设置 → 应用凭证，复制 AppID 和 AppKey
#   3. 填到下面，并把 enable 改成 true
valine:
  enable: false
  appId:
  appKey:
  notify: false
  verify: false
  pageSize: 10
  avatar: mm
  lang: zh-cn
  placeholder: 说点什么吧
  guest_info: nick,mail,link

# Disqus 评论（用 Disqus 的话填 shortname，同时把上面的 valine.enable 保持 false）
disqus_shortname:
